<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rotina PM RR</title>
  <meta name="description" content="Rotina de estudos e acompanhamento diário para o concurso da PM RR.">
  <meta name="theme-color" content="#0F2038">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="brand-name">Rotina PM RR</span>
        <span class="brand-sub" id="brandSub"></span>
      </div>
      <button class="pill" id="pill" type="button" hidden></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="nav" id="nav" aria-label="Seções">
    <button type="button" data-tab="hoje" aria-label="Hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
      <span>Hoje</span>
    </button>
    <button type="button" data-tab="semana" aria-label="Semana">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Semana</span>
    </button>
    <button type="button" data-tab="mat" aria-label="Matemática">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5H7l6 7-6 7h10"/></svg>
      <span>Matemática</span>
    </button>
    <button type="button" data-tab="reg" aria-label="Registros">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
      <span>Registros</span>
    </button>
    <button type="button" data-tab="dados" aria-label="Dados e backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      <span>Dados</span>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Este site precisa de JavaScript para funcionar.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <script src="sync.js" defer></script>
</body>
</html>
